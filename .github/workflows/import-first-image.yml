name: Import first AO3 image

on:
  push:
    paths:
      - '.github/workflows/import-first-image.yml'

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download image
        run: |
          mkdir -p backgrounds
          curl -fL --retry 3 "https://files.catbox.moe/przu69.png" -o "backgrounds/midnight-visitor-background.png"
          file "backgrounds/midnight-visitor-background.png"
      - name: Commit image
        run: |
          git config user.name "AO3 Skin Studio"
          git config user.email "actions@users.noreply.github.com"
          git add backgrounds/midnight-visitor-background.png
          git commit -m "Add Midnight Visitor background" || exit 0
          git push
